<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Nightingale</title>
    <script>
      (function () {
        var base = '/Nightingale';
        var path = window.location.pathname;
        var route = path.indexOf(base) === 0 ? path.slice(base.length) : path;
        route = route || '/';
        var target = base + '/?redirect=' + encodeURIComponent(route + window.location.search + window.location.hash);
        window.location.replace(target);
      })();
    </script>
  </head>
  <body></body>
</html>
